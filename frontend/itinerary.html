<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Voyage — your trip, from dream to final rupee."><title>Itinerary · Voyage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">

<link rel="stylesheet" href="css/itinerary.css">

<script src="js/voyage.js" defer></script><script src="js/itinerary.js" defer></script></head>
<body data-page="itinerary"><a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-nav"><nav class="container nav-inner" aria-label="Primary navigation"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">↗</span>Voyage</a><button class="btn nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button><div class="nav-links" id="nav-links"></div></nav></header>
<main class="container app-main" id="main-content"><div class="page-heading"><div><span class="eyebrow">Make every day yours</span><h1>The journey, day by day.</h1></div><button class="btn btn-primary" id="new-activity" disabled>+ Add activity</button></div><div id="page-alert" class="notice" role="status" aria-live="polite" hidden></div><div id="trip-context"><p class="loading" role="status">Finding your journey…</p></div><div id="itinerary-content" aria-busy="true"><p class="loading">Preparing your travel days…</p></div><dialog id="editor" aria-labelledby="editor-title"><div class="dialog-heading"><h2 id="editor-title">Add a moment</h2><button class="btn btn-small" type="button" id="close-editor" aria-label="Close editor">Close</button></div><div id="form-alert" class="notice" role="status" hidden></div><form id="activity-form" class="stack"><div class="field"><label for="title">The moment</label><input id="title" name="title" type="text" required minlength="2" maxlength="100" placeholder="e.g. Sunrise at the fort"></div><div class="field"><label for="location">Location</label><input id="location" name="location" type="text" required minlength="2" maxlength="100" placeholder="Place or meeting point"></div><div class="field"><label for="date">Day</label><input id="date" name="date" type="date" required></div><div class="form-grid"><div class="field"><label for="startTime">Start time</label><input id="startTime" name="startTime" type="time" required></div><div class="field"><label for="endTime">End time (optional)</label><input id="endTime" name="endTime" type="time" ></div></div><div class="field"><label for="description">Notes</label><textarea id="description" name="description" maxlength="300" rows="3"></textarea></div><button class="btn btn-primary" type="submit">Save activity</button></form></dialog></main><footer class="footer"><div class="container"><span>Voyage — your trip, from dream to final rupee.</span><a href="trips.html">Make room for the journey ↗</a></div></footer></body></html>
