<main class="container app-main" id="main-content"><div class="page-heading"><div><span class="eyebrow">Less mental maths. More memories.</span><h1>Keep the little things counted.</h1></div><a class="btn btn-primary" href="#expense-form">+ Add expense</a></div><div id="page-alert" class="notice" role="status" aria-live="polite" hidden></div><div id="trip-context"><p class="loading" role="status">Finding your journey…</p></div><div id="expense-summary"></div><div id="expense-workspace" class="workspace" hidden><section class="panel"><div class="section-header"><h2>The spending journal</h2><div class="field"><label for="category-filter">Filter category</label><select id="category-filter"><option value="">All categories</option></select></div></div><p id="expense-count" class="expense-total"></p><div id="expense-list"></div></section><section class="panel expense-form"><h2 id="expense-form-title">Add an expense</h2><p id="entry-balance" class="form-note"></p><form id="expense-form"><div class="field"><label for="amount">Amount (₹)</label><input id="amount" name="amount" type="number" class="amount-input" required min="0.01" max="9999999999.99" step="0.01" inputmode="decimal" placeholder="0.00"></div><div class="field"><label for="categoryId">Category</label><select id="categoryId" name="categoryId" required></select></div><div class="field"><label for="expenseDate">Date</label><input id="expenseDate" name="expenseDate" type="date" required></div><div class="field"><label for="description">What was it for? (optional)</label><input id="description" name="description" type="text" maxlength="200" placeholder="A train ride, a great lunch…"></div><div class="actions"><button class="btn btn-primary" type="submit">Save expense</button><button class="btn" type="button" id="cancel-edit" hidden>Cancel edit</button></div></form></section></div></main><footer class="footer"><div class="container"><span>Voyage — your trip, from dream to final rupee.</span><a href="trips.html">Make room for the journey ↗</a></div></footer></body></html>
