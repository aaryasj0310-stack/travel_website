<header class="site-nav"><nav class="container nav-inner" aria-label="Primary navigation"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">↗</span>Voyage</a><button class="btn nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button><div class="nav-links" id="nav-links"></div></nav></header>
<main class="container app-main" id="main-content"><div class="page-heading"><div><span class="eyebrow">Your corner of the world</span><h1>Account details.</h1><p>Keep your details up to date.</p></div></div><div id="page-alert" class="notice" role="status" aria-live="polite" hidden></div><div class="two-column"><section class="panel"><h2>Your profile</h2><form id="profile-form"><div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required minlength="2" maxlength="50" autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="255" autocomplete="email"></div><button class="btn btn-primary" type="submit">Save details</button></form></section><section class="panel"><h2>Change password</h2><form id="password-form"><div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" required maxlength="72" autocomplete="current-password"></div><div class="field"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></div><p class="form-note">At least 8 characters. Your current session is renewed when you change your password.</p><button class="btn btn-primary" type="submit">Update password</button></form></section></div></main><footer class="footer"><div class="container"><span>Voyage — your trip, from dream to final rupee.</span><a href="trips.html">Make room for the journey ↗</a></div></footer></body></html>
